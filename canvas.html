<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>お絵描きしりとりキャンバス</title>
    <style>
        body { background-color: #2c2f33; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        /* ボードを白に */
        canvas { background: #FFFFFF; border: 5px solid #555; cursor: crosshair; touch-action: none; border-radius: 10px; }
        .controls { margin-top: 15px; }
        input { padding: 12px; border-radius: 5px; border: none; width: 320px; font-size: 16px; }
        button { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
        .send-btn { background-color: #5865f2; color: white; }
        .clear-btn { background-color: #ed4245; color: white; }
        .eraser-btn { background-color: #fee75c; color: #000; }
        /* 注意書きのデザイン */
        .notice { font-size: 14px; color: #fff; margin-top: 15px; line-height: 1.8; text-align: center; background: #23272a; padding: 15px; border-radius: 8px; border: 1px solid #5865f2; display: inline-block; }
    </style>
</head>
<body>

    <h2>🎨 お絵描きしりとり</h2>
    <canvas id="canvas" width="400" height="400"></canvas>

    <div class="controls">
        <button class="eraser-btn" id="eraserBtn">消しゴム：OFF</button>
        <button class="clear-btn" onclick="clearCanvas()">全消去</button>
        <br><br>
        <input type="text" id="answerInput" placeholder="答えを入力（例：どーなつ　どーなっつ）">
        <button class="send-btn" onclick="sendData()">送信！</button>
        
        <br>
        <div class="notice">
            ⚠️ 答えは**「ひらがな」**で書いてね。<br>
            （カタカナ・英数字などはエラーになります。）<br>
            複数の呼び方がある時は、<br>
            **「全角」スペース**で区切って全部入力してね。<br>
            例：どーなつ　どーなっつ
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const eraserBtn = document.getElementById('eraserBtn');
        
        // ★ここにコピーしたウェブフックURLを貼り付けてください！
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1497137188389781555/ZZ9xvnvhfJohneUCCaxvMELZBHlxktLiEHVgZa3_9uly4U_s7Tq-JVXkILQuOQ1gtKIX";

        // 背景を白で塗りつぶす（透過防止）
        function fillCanvasWhite() {
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        fillCanvasWhite();

        let drawing = false;
        let isEraser = false;

        eraserBtn.onclick = () => {
            isEraser = !isEraser;
            eraserBtn.innerText = isEraser ? "消しゴム：ON" : "消しゴム：OFF";
            ctx.strokeStyle = isEraser ? "#FFFFFF" : "#000000"; 
            ctx.lineWidth = isEraser ? 25 : 3;
        };

        function startDrawing(e) { drawing = true; draw(e); }
        function stopDrawing() { drawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);
        ctx.lineCap = 'round';
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 3;

        function clearCanvas() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            fillCanvasWhite();
        }

        function sendData() {
            const input = document.getElementById('answerInput').value;
            if (!input) return alert("答えを入力してね！");

            // 名前を取得
            const urlParams = new URLSearchParams(window.location.search);
            const userName = urlParams.get('user') || "ななし";

            const isOnlyZenkakuHiragana = /^[ぁ-んー　]+$/.test(input);
            const hasHankaku = /[ -~]/.test(input); 

            if (!isOnlyZenkakuHiragana || hasHankaku) {
                return alert("エラー：ひらがなと全角スペースだけで入力してね！");
            }

            const answerList = input.split('　').filter(s => s).join(',');

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('payload_json', JSON.stringify({
                    content: `🎨 **${userName} さんがお絵描きしたよ！**\n\n「わかった！」という人は、このチャットに**ひらがな**で答えを打ってね！\n正解するとBotが反応するよ。`,
                }));
                formData.append('file', blob, 'drawing.png');

                fetch(WEBHOOK_URL, { method: 'POST', body: formData })
                .then(res => {
                    if (res.ok) {
                        alert("Discordに送信しました！");
                        clearCanvas();
                        document.getElementById('answerInput').value = "";
                    } else {
                        alert("送信失敗。URLを確認してね。");
                    }
                });
            }, 'image/png');
        }
    </script>
</body>
</html>
