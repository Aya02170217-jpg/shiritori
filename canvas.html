<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>お絵描きしりとり</title>
<style>
body {
    background-color: #2c2f33;
    color: white;
    text-align: center;
    font-family: sans-serif;
}

canvas {
    background: #fff;
    border: 5px solid #555;
    border-radius: 10px;
    display: none;
    margin: 20px auto;
}

.controls {
    text-align: center;
}

button {
    padding: 10px 20px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.rule-box {
    background: #36393f;
    padding: 15px;
    border-radius: 8px;
    margin: 10px auto;
    max-width: 350px;
    text-align: left;
}
</style>
</head>

<body>

<h2 id="targetChar">読み込み中...</h2>
<div id="timer" style="color: orange; font-size: 20px;"></div>

<div id="setupArea">

<div class="rule-box">
<b style="color: #faa61a;">【しりとりルール】</b><br>
・お絵描き制限時間は5分<br>
・ひらがなだけで入力してね！<br>
・「ー」で終わる時は、その前の文字からスタート！<br>
・「ゃ・ゅ・ょ・っ」等の小文字は、大きい文字になるよ！<br>
・答えが複数ある時は<b style="color: #ff4747;">全角スペース</b>を空けてね<br>
</div>

<input id="answerInput" placeholder="答え入力">
<br>
<button onclick="checkAnswer()">この言葉で描く！</button>

</div>

<div id="drawArea" style="display:none;">
<canvas id="canvas" width="400" height="400"></canvas>

<div class="controls">
<button onclick="setTool('pen')">ペン</button>
<button onclick="setTool('eraser')">消しゴム</button>
<button onclick="sendData()">送信</button>
</div>
</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const urlParams = new URLSearchParams(window.location.search);

const targetChar = urlParams.get('char') || "あ";
const historyList = (urlParams.get('history') || "").split(',');
const userId = urlParams.get('userId') || "0";
const userName = urlParams.get('user') || "名無し";

document.getElementById('targetChar').innerText = `【 ${targetChar} 】から始まる絵を描いてね`;

let timerInterval;

function startTimer() {
let time = 300;

timerInterval = setInterval(() => {
time--;
let m = Math.floor(time/60);
let s = time % 60;

document.getElementById('timer').innerText = `残り時間：${m}:${s.toString().padStart(2,'0')}`;

if(time <= 0){
clearInterval(timerInterval);
alert("時間切れ！");
location.reload();
}
},1000);
}

function checkAnswer() {

const rawVal = document.getElementById('answerInput').value.trim();
if (!rawVal) return alert("入力して");

const answers = rawVal.split('　');

for (const val of answers) {
if (!val) continue;

if (!/^[ぁ-んー]+$/.test(val)) return alert("ひらがなだけ");
if (val.charAt(0) !== targetChar) return alert(`${val} は ${targetChar} から始めて`);
if (val.endsWith('ん')) return alert(`${val} は使えない`);
if (historyList.includes(val)) return alert(`${val} は既出`);
}

fetch("http://127.0.0.1:5000/lock", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ userId: userId })
})
.then(res => res.json())
.then(res => {

if(res.status !== "OK"){
alert("今は他の人が描いています！");
return;
}

document.getElementById('setupArea').style.display = "none";
document.getElementById('drawArea').style.display = "block";
canvas.style.display = "block";

ctx.fillStyle = "#fff";
ctx.fillRect(0,0,400,400);

startTimer();

});
}

let drawing = false;

canvas.onmousedown = () => drawing = true;
canvas.onmouseup = () => drawing = false;
canvas.onmousemove = (e) => {
if(!drawing) return;
ctx.lineTo(e.offsetX, e.offsetY);
ctx.stroke();
};

function setTool(tool){
ctx.strokeStyle = tool === 'pen' ? "#000" : "#fff";
ctx.lineWidth = tool === 'pen' ? 3 : 30;
}

function sendData(){

fetch("http://127.0.0.1:5000/unlock", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ userId: userId })
});

alert("送信した！");
location.reload();
}

</script>

</body>
</html>
