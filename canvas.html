<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>お絵描きしりとりキャンバス</title>
    <style>
        body { background-color: #2c2f33; color: white; text-align: center; font-family: sans-serif; padding: 10px; }
        canvas { background: #FFFFFF; border: 5px solid #555; cursor: crosshair; border-radius: 10px; display: none; touch-action: none; }
        .controls { margin-top: 15px; }
        input { padding: 12px; border-radius: 5px; border: none; width: 300px; font-size: 16px; margin-bottom: 10px; color: #000; }
        button { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
        .check-btn { background-color: #43b581; color: white; }
        .send-btn { background-color: #5865f2; color: white; }
        .tool-btn { background-color: #4f545c; color: white; }
        .active-tool { background-color: #ffffff !important; color: #2c2f33 !important; border: 2px solid #5865f2; }
        .rule-box { text-align: left; background: #36393f; padding: 15px; border-radius: 8px; margin: 0 auto 15px auto; max-width: 350px; font-size: 14px; line-height: 1.6; border: 1px solid #4f545c; }
        #timerDisplay { font-size: 24px; font-weight: bold; color: #ff4747; margin-bottom: 10px; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>
    <h2 id="targetChar">読み込み中...</h2>

    <div id="setupArea">
        <div class="rule-box">
            <b style="color: #faa61a;">【しりとりルール】</b><br>
            <b style="color: #ff4747;">・絵を描く制限時間は5分です</b><br>
            ・ひらがなだけで入力してね！<br>
            ・「ー」で終わる時は、その前の文字からスタート！<br>
            　（例：かれー → れ）<br>
            ・「ゃ・ゅ・ょ・っ」等の小文字は、大きい文字になるよ！<br>
            ・答えが複数ある時は<b style="color: #ff4747;">全角スペース</b>を空けてね<br>
            　（例：どーなつ　どーなっつ）
        </div>
        <input type="text" id="answerInput" placeholder="答えを入力（例：りんご）">
        <br>
        <button class="check-btn" onclick="checkAnswer()">この言葉で描く！</button>
    </div>

    <div id="drawArea" style="display: none;">
        <div id="timerDisplay">残り時間 05:00</div>
        <canvas id="canvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="penBtn" class="tool-btn active-tool" onclick="setTool('pen')">ペン</button>
            <button id="eraserBtn" class="tool-btn" onclick="setTool('eraser')">消しゴム</button>
            <button class="send-btn" onclick="sendData()">Discordへ送信！</button>
        </div>
    </div>

    <script>
        // URLから情報（文字や名前）を受け取る
        var urlParams = new URLSearchParams(window.location.search);
        var targetChar = urlParams.get('char') || "？";
        var userName = urlParams.get('user') || "ななし";
        var userId = urlParams.get('userId') || "0";
        var WEBHOOK_URL = urlParams.get('webhook');
        var historyList = (urlParams.get('history') || "").split(',');
        var currentTurn = urlParams.get('turn') || "0";

        // 「読み込み中...」を「●●から始まる絵を描いてね」に変える
        document.getElementById('targetChar').innerText = "【 " + targetChar + " 】から始まる絵を描いてね";

        var timeLeft = 300; 
        var timerInterval;

        function checkAnswer() {
            var val = document.getElementById('answerInput').value.trim();
            if (!val) return alert("答えを入力してね！");
            
            var answers = val.split('　');
            for (var i = 0; i < answers.length; i++) {
                var a = answers[i];
                if (!a) continue;
                if (!/^[ぁ-んー]+$/.test(a)) return alert("ひらがなだけで入力してね！");
                if (a.charAt(0) !== targetChar) return alert("「" + targetChar + "」から始まる言葉にしてね！");
                if (a.endsWith('ん')) return alert("「ん」で終わる言葉は使えないよ！");
                if (historyList.indexOf(a) !== -1) return alert("その言葉はもう使われているよ！");
            }

            document.getElementById('setupArea').style.display = "none";
            document.getElementById('drawArea').style.display = "block";
            document.getElementById('canvas').style.display = "inline-block";
            
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = "#FFFFFF"; 
            ctx.fillRect(0, 0, 400, 400);

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(function() {
                timeLeft--;
                var m = Math.floor(timeLeft / 60);
                var s = timeLeft % 60;
                document.getElementById('timerDisplay').innerText = "残り時間 " + ("0" + m).slice(-2) + ":" + ("0" + s).slice(-2);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("制限時間切れです！");
                    location.reload(); 
                }
            }, 1000);
        }

        var currentTool = 'pen';
        function setTool(t) {
            currentTool = t;
            var ctx = document.getElementById('canvas').getContext('2d');
            document.getElementById('penBtn').className = (t === 'pen' ? 'tool-btn active-tool' : 'tool-btn');
            document.getElementById('eraserBtn').className = (t === 'eraser' ? 'tool-btn active-tool' : 'tool-btn');
            ctx.strokeStyle = (t === 'pen' ? "#000000" : "#FFFFFF");
            ctx.lineWidth = (t === 'pen' ? 3 : 30);
        }

        var drawing = false;
        var canvasElem = document.getElementById('canvas');
        var ctx2d = canvasElem.getContext('2d');

        function getPos(e) {
            var rect = canvasElem.getBoundingClientRect();
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvasElem.onmousedown = canvasElem.ontouchstart = function(e) { 
            drawing = true; 
            ctx2d.beginPath(); 
            var p = getPos(e); 
            ctx2d.moveTo(p.x, p.y); 
        };
        canvasElem.onmouseup = canvasElem.ontouchend = function() { drawing = false; };
        canvasElem.onmousemove = canvasElem.ontouchmove = function(e) {
            if (!drawing) return;
            e.preventDefault();
            var p = getPos(e);
            ctx2d.lineTo(p.x, p.y); 
            ctx2d.stroke();
        };

        function sendData() {
            clearInterval(timerInterval);
            var ans = document.getElementById('answerInput').value.trim();
            var encodedAns = "";
            var uint8 = new TextEncoder().encode(ans);
            for(var i=0; i<uint8.length; i++) {
                encodedAns += uint8[i].toString(16).padStart(2, '0');
            }
            
            var fileName = "ans_" + encodedAns + "_turn_" + currentTurn + "_id_" + userId + ".png";

            canvasElem.toBlob(function(blob) {
                var formData = new FormData();
                formData.append('payload_json', JSON.stringify({
                    content: "🎨 **" + userName + " さんがお絵描きしたよ！**\n答えがわかったらチャットに打ってね！"
                }));
                formData.append('file', blob, fileName);

                fetch(WEBHOOK_URL, { method: 'POST', body: formData }).then(function(res) {
                    if (res.ok) window.close();
                    else alert("送信に失敗しました。");
                });
            }, 'image/png');
        }
    </script>
</body>
</html>
