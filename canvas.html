<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>お絵描きしりとり</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; background: #f0f0f0; overflow: hidden; touch-action: none; }
        #header { background: #333; color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        #timer { color: #ffcc00; font-weight: bold; font-size: 1.2em; margin-right: 10px; }
        canvas { background: white; border: 2px solid #333; cursor: crosshair; touch-action: none; display: block; margin: 10px auto; }
        .controls { margin-top: 10px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: white; font-weight: bold; }
        #sendBtn { background: #28a745; }
        #clearBtn { background: #dc3545; }
        #answerInput { padding: 10px; font-size: 16px; border: 2px solid #333; border-radius: 5px; width: 200px; }
    </style>
</head>
<body>

<div id="header">
    <div style="margin-left:10px;">次は：【 <span id="targetChar">?</span> 】</div>
    <div id="timer">残り 05:00</div>
</div>

<canvas id="canvas"></canvas>

<div class="controls">
    <input type="text" id="answerInput" placeholder="答えを入力（複数可：りんご　林檎）">
    <button id="sendBtn">送信する</button>
    <button id="clearBtn">すべて削除</button>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const urlParams = new URLSearchParams(window.location.search);
    const targetChar = urlParams.get('char') || 'あ';
    const webhookUrl = urlParams.get('webhook');
    const userId = urlParams.get('userId');
    const userName = urlParams.get('user') || 'ゲスト';
    document.getElementById('targetChar').innerText = targetChar;

    // キャンバスサイズ設定
    canvas.width = window.innerWidth * 0.95;
    canvas.height = window.innerHeight * 0.6;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    // タイマー処理 (5分)
    let timeLeft = 300;
    const timerElement = document.getElementById('timer');
    const countdown = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerElement.innerText = `残り ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            alert("制限時間です！自動的に送信されます。");
            sendImage();
        }
    }, 1000);

    // 描画ロジック
    let drawing = false;
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('mousemove', (e) => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('touchstart', (e) => { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
    canvas.addEventListener('touchend', () => drawing = false);

    // すべて削除ボタン
    document.getElementById('clearBtn').addEventListener('click', () => {
        if(confirm("すべて消去して白紙に戻しますか？")) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    });

    // 送信処理
    async function sendImage() {
        const answer = document.getElementById('answerInput').value.trim();
        if (!answer) { alert("答えを入力してね！"); return; }
        
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const hexAns = Array.from(new TextEncoder().encode(answer)).map(b => b.toString(16).padStart(2, '0')).join('');
        const formData = new FormData();
        formData.append('file', blob, `ans_${hexAns}_user_${userId}.png`);
        formData.append('payload_json', JSON.stringify({ content: `🎨 **${userName}** さんが描いたよ！答えがわかった人はチャットに打ってね！` }));

        await fetch(webhookUrl, { method: 'POST', body: formData });
        alert("送信したよ！タブを閉じて Discord に戻ってね。");
        window.close();
    }

    document.getElementById('sendBtn').addEventListener('click', sendImage);
</script>
</body>
</html>
