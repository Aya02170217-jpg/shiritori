<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>お絵描きしりとりキャンバス</title>
<style>
body { background-color: #2c2f33; color: white; text-align: center; font-family: sans-serif; padding: 10px; margin: 0; }
#timerDisplay { position: fixed; top: 10px; right: 10px; background: #faa61a; color: #000; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 14px; z-index: 100; }
canvas { background: #FFFFFF; border: 5px solid #555; cursor: crosshair; border-radius: 10px; display: none; touch-action: none; }
.controls { margin-top: 15px; }
input { padding: 12px; border-radius: 5px; border: none; width: 300px; font-size: 16px; margin-bottom: 10px; color: #000; }
button { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
.check-btn { background-color: #43b581; color: white; }
.send-btn { background-color: #5865f2; color: white; }
.tool-btn { background-color: #4f545c; color: white; }
.clear-btn { background-color: #dc3545; color: white; }
.active-tool { background-color: #ffffff !important; color: #2c2f33 !important; border: 2px solid #5865f2; }
.rule-box { text-align: left; background: #36393f; padding: 15px; border-radius: 8px; margin: 0 auto 15px auto; max-width: 350px; font-size: 14px; line-height: 1.6; border: 1px solid #4f545c; }
#errorArea { display: none; margin-top: 100px; padding: 30px; background: #dc3545; color: white; border-radius: 10px; font-size: 24px; font-weight: bold; width: 80%; margin-left: auto; margin-right: auto; }
</style>
</head>
<body>

<div id="timerDisplay">残り 05:00</div>
<h2 id="targetChar">読み込み中...</h2>
<div id="errorArea"></div>

<div id="setupArea" style="display: none;">
    <div class="rule-box">
        <b style="color: #faa61a;">【しりとりルール】</b><br>
        ・5分以内に送信してね！<br>
        ・ひらがなだけで入力してね！<br>
        ・「ー」で終わる時は、その前の文字からスタート！<br>
        ・答えが複数ある時は<b style="color: #ff4747;">全角スペース</b>を空けてね
    </div>
    <input type="text" id="answerInput" placeholder="答えを入力（例：りんご）">
    <br>
    <button class="check-btn" onclick="checkAnswer()">この言葉で描く！</button>
</div>

<div id="drawArea" style="display: none;">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="controls">
        <button id="penBtn" class="tool-btn active-tool" onclick="setTool('pen')">ペン</button>
        <button id="eraserBtn" class="tool-btn" onclick="setTool('eraser')">消しゴム</button>
        <button class="clear-btn" onclick="clearCanvas()">すべてを削除</button>
        <button class="send-btn" onclick="sendData()">Discordへ送信！</button>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const userId = urlParams.get('userId');
const token = urlParams.get('token');
const targetChar = urlParams.get('char') || "？";
const userName = urlParams.get('user') || "ななし";
const WEBHOOK_URL = urlParams.get('webhook');
const historyList = (urlParams.get('history') || "").split(',');
const startParam = urlParams.get('start');
const startTime = startParam ? parseInt(startParam) : Math.floor(Date.now() / 1000);

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let isSubmitted = false;
let countdown;

// --- 鉄壁ガード：Botに問い合わせ ---
async function init() {
    if (!userId || !token) {
        showFatalError("URLが正しくありません。");
        return;
    }

    try {
        // BotのAPIに確認（localhost部分はBotを動かしているPCの状況に合わせてください）
        const response = await fetch(`http://localhost:8080/check?userId=${userId}&token=${token}`);
        const data = await response.json();

        if (data.allowed) {
            document.getElementById('targetChar').innerText = `【 ${targetChar} 】から始まる絵を描いてね`;
            document.getElementById('setupArea').style.display = "block";
            startTimer();
        } else {
            showFatalError("アクセス権がありません。<br>他の人が挑戦中か、古いURLです。");
        }
    } catch (e) {
        showFatalError("サーバー（Bot）に接続できません。<br>Botが起動しているか確認してください。");
    }
}

function showFatalError(msg) {
    document.getElementById('targetChar').style.display = "none";
    document.getElementById('timerDisplay').style.display = "none";
    const err = document.getElementById('errorArea');
    err.innerHTML = msg;
    err.style.display = "block";
}

function startTimer() {
    const timerDisplay = document.getElementById('timerDisplay');
    countdown = setInterval(() => {
        const now = Math.floor(Date.now() / 1000);
        let timeLeft = 300 - (now - startTime);
        if (timeLeft <= 0) {
            timeLeft = 0;
            clearInterval(countdown);
            if (!isSubmitted) {
                if (document.getElementById('drawArea').style.display === "block") sendData();
                else showFatalError("時間切れです。");
            }
        }
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerDisplay.innerText = `残り ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }, 1000);
}

function checkAnswer() {
    const rawVal = document.getElementById('answerInput').value.trim();
    if (!rawVal) return alert("答えを入力してね！");
    const answers = rawVal.split('　');
    for (const val of answers) {
        if (!/^[ぁ-んー]+$/.test(val)) return alert("ひらがなだけで入力してね！");
        if (val.charAt(0) !== targetChar) return alert(`「${targetChar}」から始まる言葉にしてね！`);
        if (val.endsWith('ん')) return alert("「ん」で終わる言葉はダメだよ！");
        if (historyList.includes(val)) return alert("その言葉はもう使われてるよ！");
    }
    document.getElementById('setupArea').style.display = "none";
    document.getElementById('drawArea').style.display = "block";
    canvas.style.display = "inline-block";
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, 400, 400);
    setTool('pen');
}

let currentTool = 'pen';
function setTool(t) {
    currentTool = t;
    document.getElementById('penBtn').className = (t === 'pen' ? 'tool-btn active-tool' : 'tool-btn');
    document.getElementById('eraserBtn').className = (t === 'eraser' ? 'tool-btn active-tool' : 'tool-btn');
    ctx.strokeStyle = (t === 'pen' ? "#000000" : "#FFFFFF");
    ctx.lineWidth = (t === 'pen' ? 3 : 30);
}

function clearCanvas() {
    if(confirm("すべて削除しますか？")) {
        ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

let drawing = false;
const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
};
canvas.onmousedown = canvas.ontouchstart = (e) => { 
    drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); 
    if(e.type === 'touchstart') e.preventDefault();
};
canvas.onmouseup = canvas.ontouchend = () => { drawing = false; };
canvas.onmousemove = canvas.ontouchmove = (e) => {
    if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
};

function sendData() {
    if (isSubmitted) return;
    const ans = document.getElementById('answerInput').value.trim();
    const encodedAns = Array.from(new TextEncoder().encode(ans)).map(b => b.toString(16).padStart(2, '0')).join('');
    
    canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({ content: `🎨 **${userName} さんがお絵描きしたよ！**` }));
        formData.append('file', blob, `ans_${encodedAns}_id_${userId}_${token}.png`);
        
        fetch(WEBHOOK_URL, { method: 'POST', body: formData }).then(res => { 
            if (res.ok) { 
                isSubmitted = true;
                clearInterval(countdown);
                alert("送信しました！Discordに戻ってください。");
                window.close(); 
            } else {
                alert("送信に失敗しました。");
            }
        });
    }, 'image/png');
}

// 起動
init();
</script>
</body>
</html>
