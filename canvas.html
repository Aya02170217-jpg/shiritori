<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>お絵描きしりとりキャンバス</title>
<style>
body { background-color: #2c2f33; color: white; text-align: center; font-family: sans-serif; padding: 10px; }
canvas { background: #FFFFFF; border: 5px solid #555; cursor: crosshair; border-radius: 10px; display: none; touch-action: none; }
.controls { margin-top: 15px; }
input { padding: 12px; border-radius: 5px; border: none; width: 300px; font-size: 16px; margin-bottom: 10px; color: #000; }
button { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
.check-btn { background-color: #43b581; color: white; }
.send-btn { background-color: #5865f2; color: white; }
.tool-btn { background-color: #4f545c; color: white; }
.active-tool { background-color: #ffffff !important; color: #2c2f33 !important; border: 2px solid #5865f2; }
.rule-box { text-align: left; background: #36393f; padding: 15px; border-radius: 8px; margin: 0 auto 15px auto; max-width: 350px; font-size: 14px; line-height: 1.6; border: 1px solid #4f545c; }
</style>
</head>
<body>

<h2 id="targetChar">読み込み中...</h2>

<div id="setupArea">
<div class="rule-box">
<b style="color: #faa61a;">【しりとりルール】</b><br>
・お絵描き制限時間は5分<br>
・ひらがなだけで入力してね！<br>
・「ー」で終わる時は、その前の文字からスタート！<br>
・「ゃ・ゅ・ょ・っ」等の小文字は、大きい文字になるよ！<br>
・答えが複数ある時は<b style="color: #ff4747;">全角スペース</b>を空けてね<br>
</div>

<input type="text" id="answerInput" placeholder="答えを入力（例：りんご）">
<br>
<button class="check-btn" onclick="checkAnswer()">この言葉で描く！</button>
</div>

<div id="drawArea" style="display:none;">
<div id="timer" style="display:none; font-size:18px; margin-bottom:8px; color:#faa61a;">残り時間：5:00</div>
<canvas id="canvas" width="400" height="400"></canvas>

<div class="controls">
<button onclick="setTool('pen')">ペン</button>
<button onclick="setTool('eraser')">消しゴム</button>
<button onclick="sendData()">送信</button>
</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const urlParams = new URLSearchParams(window.location.search);

const WEBHOOK_URL = urlParams.get('webhook');
const targetChar = urlParams.get('char') || "？";
const historyList = (urlParams.get('history') || "").split(',');
const userId = urlParams.get('userId') || "0";
const userName = urlParams.get('user') || "ななし";

document.getElementById('targetChar').innerText = `【 ${targetChar} 】から始まる絵を描いてね`;

async function checkAnswer() {
const rawVal = document.getElementById('answerInput').value.trim();
if (!rawVal) return alert("入力して");

const answers = rawVal.split('　');

for (const val of answers) {
if (!val) continue;
if (!/^[ぁ-んー]+$/.test(val)) return alert("ひらがなのみ");
if (val[0] !== targetChar) return alert("最初違う");
if (val.endsWith('ん')) return alert("ん禁止");
if (historyList.includes(val)) return alert("既出");
}

// 🔒 Webhookでロック送信
await fetch(WEBHOOK_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
userId: userId,
userName: userName,
answers: answers
})
});

document.getElementById('setupArea').style.display = "none";
document.getElementById('drawArea').style.display = "block";
canvas.style.display = "block";

ctx.fillStyle = "#fff";
ctx.fillRect(0,0,400,400);

startTimer();
}

let timeLeft = 300;
function startTimer(){
document.getElementById('timer').style.display="block";

setInterval(()=>{
timeLeft--;
const m = Math.floor(timeLeft/60);
const s = timeLeft%60;
document.getElementById('timer').innerText = `残り時間：${m}:${s.toString().padStart(2,'0')}`;

if(timeLeft<=0){
alert("時間切れ");
window.close();
}
},1000);
}

let drawing=false;
canvas.onmousedown=e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);}
canvas.onmouseup=()=>drawing=false;
canvas.onmousemove=e=>{if(!drawing)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}

function setTool(t){
ctx.strokeStyle = t==="pen"?"#000":"#fff";
ctx.lineWidth = t==="pen"?3:30;
}

function sendData(){
const ans = document.getElementById('answerInput').value.trim();
const encoded = Array.from(new TextEncoder().encode(ans)).map(b=>b.toString(16).padStart(2,'0')).join('');
const name = `ans_${encoded}_id_${userId}.png`;

canvas.toBlob(blob=>{
const fd=new FormData();
fd.append('payload_json',JSON.stringify({
content:`🎨 ${userName} が描いた！`
}));
fd.append('file',blob,name);
fetch(WEBHOOK_URL,{method:'POST',body:fd});
window.close();
});
}
</script>

</body>
</html>
