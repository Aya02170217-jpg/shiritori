<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>お絵描きしりとりキャンバス</title>

<style>
body {
background-color: #2c2f33;
color: white;
text-align: center;
font-family: sans-serif;
padding: 10px;
}

canvas {
background: #FFFFFF;
border: 5px solid #555;
cursor: crosshair;
border-radius: 10px;
display: none;
touch-action: none;
margin: auto;
}

.controls { margin-top: 15px; }

input {
padding: 12px;
border-radius: 5px;
border: none;
width: 300px;
font-size: 16px;
margin-bottom: 10px;
color: #000;
}

button {
padding: 10px 20px;
border-radius: 5px;
border: none;
cursor: pointer;
font-weight: bold;
margin: 5px;
}

.check-btn { background-color: #43b581; color: white; }
.send-btn { background-color: #5865f2; color: white; }
.tool-btn { background-color: #4f545c; color: white; }
.active-tool { background-color: #ffffff !important; color: #2c2f33 !important; }

/* ルール */
.rule-box {
text-align: left;
background: #36393f;
padding: 15px;
border-radius: 8px;
margin: 0 auto 15px auto;
max-width: 350px;
font-size: 14px;
line-height: 1.6;
border: 1px solid #4f545c;
}

/* タイマー */
#timer {
font-size: 18px;
color: #faa61a;
margin-top: 10px;
}
</style>
</head>

<body>

<h2 id="targetChar">読み込み中...</h2>

<div id="setupArea">
<div class="rule-box">
<b style="color: #faa61a;">【しりとりルール】</b><br>
・お絵描き制限時間は5分<br>
・ひらがなだけで入力してね！<br>
・「ー」で終わる時は、その前の文字からスタート！<br>
・「ゃ・ゅ・ょ・っ」等の小文字は、大きい文字になるよ！<br>
・答えが複数ある時は<b style="color: #ff4747;">全角スペース</b>を空けてね<br>
</div>

<input type="text" id="answerInput" placeholder="答えを入力（例：りんご）">
<br>
<button class="check-btn" onclick="checkAnswer()">この言葉で描く！</button>
</div>

<div id="drawArea" style="display: none;">
<canvas id="canvas" width="400" height="400"></canvas>

<div class="controls">
<div id="timer">残り時間：5:00</div>

<button id="penBtn" class="tool-btn active-tool" onclick="setTool('pen')">ペン</button>
<button id="eraserBtn" class="tool-btn" onclick="setTool('eraser')">消しゴム</button>
<button class="send-btn" onclick="sendData()">Discordへ送信！</button>
</div>
</div>

<script>
const LOCK_API = "http://127.0.0.1:5000/lock";
const UNLOCK_API = "http://127.0.0.1:5000/unlock";

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const urlParams = new URLSearchParams(window.location.search);

const WEBHOOK_URL = urlParams.get('webhook');
const targetChar = urlParams.get('char') || "？";
const historyList = (urlParams.get('history') || "").split(',');
const userId = urlParams.get('userId') || "0";
const userName = urlParams.get('user') || "ななし";

document.getElementById('targetChar').innerText = `【 ${targetChar} 】から始まる絵を描いてね`;

async function checkAnswer() {
const rawVal = document.getElementById('answerInput').value.trim();
if (!rawVal) return alert("答えを入力してね！");

const answers = rawVal.split('　');

for (const val of answers) {
if (!val) continue;
if (!/^[ぁ-んー]+$/.test(val)) return alert("ひらがなだけで入力してね！");
if (val.charAt(0) !== targetChar) return alert(`「${val}」は「${targetChar}」から始まる言葉にしてね！`);
if (val.endsWith('ん')) return alert(`「${val}」は使えないよ！`);
if (historyList.includes(val)) return alert(`「${val}」はもう使われてるよ！`);
}

// 🔒 ロック取得
const res = await fetch(LOCK_API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({userId:userId})
});

const data = await res.json();

if(data.status !== "OK"){
alert("今は他の人が描いています！");
return;
}

// OKなら描画へ
document.getElementById('setupArea').style.display = "none";
document.getElementById('drawArea').style.display = "block";
canvas.style.display = "block";

ctx.fillStyle = "#FFFFFF";
ctx.fillRect(0, 0, 400, 400);

startTimer();
}

let timeLeft = 300;

function startTimer(){
setInterval(()=>{
timeLeft--;
const m = Math.floor(timeLeft/60);
const s = timeLeft%60;
document.getElementById('timer').innerText =
`残り時間：${m}:${s.toString().padStart(2,'0')}`;

if(timeLeft <= 0){
alert("時間切れ");
unlock();
location.reload();
}
},1000);
}

let drawing = false;

const getPos = (e) => {
const rect = canvas.getBoundingClientRect();
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;
return { x: clientX - rect.left, y: clientY - rect.top };
};

canvas.onmousedown = canvas.ontouchstart = (e) => {
drawing = true;
ctx.beginPath();
const p = getPos(e);
ctx.moveTo(p.x, p.y);
};

canvas.onmouseup = canvas.ontouchend = () => drawing = false;

canvas.onmousemove = canvas.ontouchmove = (e) => {
if (!drawing) return;
e.preventDefault();
const p = getPos(e);
ctx.lineTo(p.x, p.y);
ctx.stroke();
};

function setTool(t) {
ctx.strokeStyle = (t === 'pen' ? "#000000" : "#FFFFFF");
ctx.lineWidth = (t === 'pen' ? 3 : 30);

document.getElementById('penBtn').classList.toggle("active-tool", t==="pen");
document.getElementById('eraserBtn').classList.toggle("active-tool", t==="eraser");
}

// 🔓 ロック解除
function unlock(){
fetch(UNLOCK_API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({userId:userId})
});
}

function sendData() {
const ans = document.getElementById('answerInput').value.trim();

const encodedAns = Array.from(new TextEncoder().encode(ans))
.map(b => b.toString(16).padStart(2, '0')).join('');

const fileName = `ans_${encodedAns}_id_${userId}.png`;

canvas.toBlob(blob => {
const formData = new FormData();

formData.append('payload_json', JSON.stringify({
content: `🎨 **${userName} さんがお絵描きしたよ！**\n答えがわかったらチャットに打ってね！`
}));

formData.append('file', blob, fileName);

fetch(WEBHOOK_URL, { method: 'POST', body: formData });

unlock();
window.close();
}, 'image/png');
}
</script>

</body>
</html>
