<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>お絵描きしりとりキャンバス</title>
    <style>
        body { background-color: #2c2f33; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        canvas { background: #999; border: 5px solid #555; cursor: crosshair; touch-action: none; border-radius: 10px; }
        .controls { margin-top: 15px; }
        input { padding: 12px; border-radius: 5px; border: none; width: 300px; font-size: 16px; }
        button { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
        .send-btn { background-color: #5865f2; color: white; }
        .clear-btn { background-color: #ed4245; color: white; }
        .eraser-btn { background-color: #fee75c; color: #000; }
        .notice { font-size: 13px; color: #ccc; margin-top: 15px; line-height: 1.8; text-align: center; background: #23272a; padding: 10px; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>

    <h2>🎨 お絵描きしりとり</h2>
    <canvas id="canvas" width="400" height="400"></canvas>

    <div class="controls">
        <button class="eraser-btn" id="eraserBtn">消しゴム：OFF</button>
        <button class="clear-btn" onclick="clearCanvas()">全消去</button>
        <br><br>
        <input type="text" id="answerInput" placeholder="答えを入力（例：どーなつ　どーなっつ）">
        <button class="send-btn" onclick="sendData()">送信！</button>
        
        <br>
        <div class="notice">
            ⚠️ 答えは**ひらがな**で書いてね。<br>
            （カタカナ・英語・漢字・数字・半角文字はエラーになります）<br>
            紛らわしいもの（言い方変えてほしいもの）は、<br>
            **全角スペース**を空けて複数入力してね！<br>
            例：どーなつ　どーなっつ
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const eraserBtn = document.getElementById('eraserBtn');
        
        // ★ここにコピーしたウェブフックURLを貼り付けてください！
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1497137188389781555/ZZ9xvnvhfJohneUCCaxvMELZBHlxktLiEHVgZa3_9uly4U_s7Tq-JVXkILQuOQ1gtKIX";

        let drawing = false;
        let isEraser = false;

        // 消しゴム切り替え機能
        eraserBtn.onclick = () => {
            isEraser = !isEraser;
            eraserBtn.innerText = isEraser ? "消しゴム：ON" : "消しゴム：OFF";
            ctx.strokeStyle = isEraser ? "#999" : "#000"; 
            ctx.lineWidth = isEraser ? 25 : 3;
        };

        function startDrawing(e) { drawing = true; draw(e); }
        function stopDrawing() { drawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);
        ctx.lineCap = 'round';
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 3;

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function sendData() {
            const input = document.getElementById('answerInput').value; // trimはしない（半角スペース検知のため）
            if (!input) return alert("答えを入力してね！");

            // 【厳格チェック】ひらがな・長音・全角スペース以外、および半角全般を禁止
            const isOnlyZenkakuHiragana = /^[ぁ-んー　]+$/.test(input);
            const hasHankaku = /[ -~]/.test(input); 

            if (!isOnlyZenkakuHiragana || hasHankaku) {
                return alert("エラー：ひらがなと全角スペースだけで入力してね！\n（半角文字や数字、カタカナなどは使えません）");
            }

            // 全角スペースで区切って配列用にする
            const answerList = input.split('　').filter(s => s).join(',');

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('payload_json', JSON.stringify({
                    content: `🎨 **しりとり画像が届いたよ！**\n答えがわかったらチャットに打ってね！`,
                    embeds: [{
                        description: `※この絵の正解データ: \`!e ${answerList}\``,
                        color: 0x5865f2
                    }]
                }));
                formData.append('file', blob, 'drawing.png');

                fetch(WEBHOOK_URL, { method: 'POST', body: formData })
                .then(res => {
                    if (res.ok) {
                        alert("Discordに送信しました！");
                        clearCanvas();
                        document.getElementById('answerInput').value = "";
                    } else {
                        alert("送信失敗。URLが正しいか確認してね。");
                    }
                });
            });
        }
    </script>
</body>
</html>
